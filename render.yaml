services:
  - type: web
    name: digit-radar
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DERIV_API_TOKEN
        sync: false
      - key: DERIV_APP_ID
        sync: false
      - key: DERIV_ACCOUNT_DEMO
        sync: false
      - key: DERIV_ACCOUNT_REAL
        sync: false
      - key: DERIV_ALLOW_REAL
        value: "0"
      - key: MAX_STAKE
        value: "10"
